spring:
  profiles:
    active: test

  jwt:
    public-key: "classpath:certs/public_key.pem"

  config:
    import: optional:file:../.env[.properties]

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

  endpoints:
    web:
      exposure:
        include: health,info
