server:
  port: ${API_GATE_WAY_SERVICE_PORT:8084}

spring:
  cloud:
    gateway:
      routes:

        - id: core-auth-service
          uri: http://localhost:${AUTH_SERVICE_PORT:8080}
          predicates:
            - Path=/auth/**

        - id: core-user-service
          uri: http://localhost:${USER_SERVICE_PORTL:8081}
          predicates:
            - Path=/users/**

        - id: payment-system-product-service
          uri: http://localhost:${PRODUCT_SERVICE_PORT:8082}
          predicates:
            - Path=/products/**

        - id: payment-system-order-service
          uri: http://localhost:${ORDER_SERVICE_PORT:8083}
          predicates:
            - Path=/orders/**
