server:
  port: ${API_GATE_WAY_SERVICE_PORT}

spring:
  jwt:
    public-key: "classpath:certs/public_key.pem"

  config:
    import: optional:file:.env[.properties]

  cloud:
    gateway:
      routes:

        - id: core-auth-service
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/auth/**

        - id: core-user-service
          uri: ${USER_SERVICE_URL}
          predicates:
            - Path=/users/**

        - id: payment-system-product-service
          uri: ${PRODUCT_SERVICE_URL}
          predicates:
            - Path=/products/**

        - id: payment-system-order-service
          uri: ${ORDER_SERVICE_URL}
          predicates:
            - Path=/orders/**

        - id: payment-system-payment-service
          uri: ${PAYMENT_SERVICE_URL}
          predicates:
            - Path=/payments/**

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

  endpoints:
    web:
      exposure:
        include: health,info
