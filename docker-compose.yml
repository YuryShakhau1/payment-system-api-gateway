services:
  user-service-db:
    image: postgres:18-alpine
    container_name: user_service_postgres
    environment:
      - POSTGRES_DB=${USER_SERVICE_DB_NAME}
      - POSTGRES_USER=${USER_SERVICE_DB_USERNAME}
      - POSTGRES_PASSWORD=${USER_SERVICE_DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "${USER_SERVICE_DB_PORT}:5432"
    volumes:
      - user_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always


  auth-service-db:
    image: postgres:18-alpine
    container_name: auth_service_postgres
    environment:
      - POSTGRES_DB=${AUTH_SERVICE_DB_NAME}
      - POSTGRES_USER=${AUTH_SERVICE_DB_USERNAME}
      - POSTGRES_PASSWORD=${AUTH_SERVICE_DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "${AUTH_SERVICE_DB_PORT}:5432"
    volumes:
      - auth_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always


  product-service-db:
    image: postgres:18-alpine
    container_name: product_service_postgres
    environment:
      - POSTGRES_DB=${PRODUCT_SERVICE_DB_NAME}
      - POSTGRES_USER=${PRODUCT_SERVICE_DB_USERNAME}
      - POSTGRES_PASSWORD=${PRODUCT_SERVICE_DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "${PRODUCT_SERVICE_DB_PORT}:5432"
    volumes:
      - product_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  order-service-db:
    image: postgres:18-alpine
    container_name: order_service_postgres
    environment:
      - POSTGRES_DB=${ORDER_SERVICE_DB_NAME}
      - POSTGRES_USER=${ORDER_SERVICE_DB_USERNAME}
      - POSTGRES_PASSWORD=${ORDER_SERVICE_DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "${ORDER_SERVICE_DB_PORT}:5432"
    volumes:
      - order_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always


  redis:
    image: redis:8.8-alpine
    container_name: microservice-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_SECRET_PASSWORD}
    volumes:
      - payment_system_redis_data:/data
    restart: always


  kafka:
    image: apache/kafka:4.0.2
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'

      KAFKA_LISTENERS: 'CLIENT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'CLIENT://localhost:9092,INTERNAL://kafka:29092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CLIENT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - payment_system_kafka_data:/var/lib/kafka/data


  core-auth-service:
    image: ghcr.io/yuryshakhau1/core-auth-service:latest
    container_name: core_auth_service
    profiles:
      - docker
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"
    environment:
      - AUTH_SERVICE_PORT=${AUTH_SERVICE_PORT}
      - AUTH_SERVICE_DB_NAME=${AUTH_SERVICE_DB_NAME}
      - AUTH_SERVICE_DB_USERNAME=${AUTH_SERVICE_DB_USERNAME}
      - AUTH_SERVICE_DB_PASSWORD=${AUTH_SERVICE_DB_PASSWORD}
      - AUTH_SERVICE_DB_PORT=${AUTH_SERVICE_DB_PORT}
      - KAFKA_HOST_PORT=${KAFKA_HOST_PORT}
      - CARD_SECRET_KEY=${CARD_SECRET_KEY}
      - REDIS_SECRET_PASSWORD=${REDIS_SECRET_PASSWORD}
    depends_on:
      - auth-service-db


  core-user-service:
    image: ghcr.io/yuryshakhau1/core-user-service:latest
    container_name: core_user_service
    profiles:
      - docker
    ports:
      - "${USER_SERVICE_PORT}:${USER_SERVICE_PORT}"
    environment:
      - USER_SERVICE_PORT=${USER_SERVICE_PORT}
      - USER_SERVICE_DB_NAME=${USER_SERVICE_DB_NAME}
      - USER_SERVICE_DB_USERNAME=${USER_SERVICE_DB_USERNAME}
      - USER_SERVICE_DB_PASSWORD=${USER_SERVICE_DB_PASSWORD}
      - USER_SERVICE_DB_PORT=${USER_SERVICE_DB_PORT}
      - KAFKA_HOST_PORT=${KAFKA_HOST_PORT}
      - CARD_SECRET_KEY=${CARD_SECRET_KEY}
      - REDIS_SECRET_PASSWORD=${REDIS_SECRET_PASSWORD}
    depends_on:
      - user-service-db
      - redis
      - kafka


  payment-system-product-service:
    image: ghcr.io/yuryshakhau1/payment-system-product-service:latest
    container_name: payment_system_product_service
    profiles:
      - docker
    ports:
      - "${PRODUCT_SERVICE_PORT}:${PRODUCT_SERVICE_PORT}"
    environment:
      - PRODUCT_SERVICE_PORT=${PRODUCT_SERVICE_PORT}
      - PRODUCT_SERVICE_DB_NAME=${PRODUCT_SERVICE_DB_NAME}
      - PRODUCT_SERVICE_DB_USERNAME=${PRODUCT_SERVICE_DB_USERNAME}
      - PRODUCT_SERVICE_DB_PASSWORD=${PRODUCT_SERVICE_DB_PASSWORD}
      - PRODUCT_SERVICE_DB_PORT=${PRODUCT_SERVICE_DB_PORT}
    depends_on:
      - product-service-db


  payment-system-order-service:
    image: ghcr.io/yuryshakhau1/payment-system-order-service:latest
    container_name: payment_system_order_service
    profiles:
      - docker
    ports:
      - "${ORDER_SERVICE_PORT}:${ORDER_SERVICE_PORT}"
    environment:
      - ORDER_SERVICE_PORT=${ORDER_SERVICE_PORT}
      - ORDER_SERVICE_DB_NAME=${ORDER_SERVICE_DB_NAME}
      - ORDER_SERVICE_DB_USERNAME=${ORDER_SERVICE_DB_USERNAME}
      - ORDER_SERVICE_DB_PASSWORD=${ORDER_SERVICE_DB_PASSWORD}
      - ORDER_SERVICE_DB_PORT=${ORDER_SERVICE_DB_PORT}
      - PRODUCT_SERVICE_URL=${PRODUCT_SERVICE_URL}
    depends_on:
      - order-service-db


  payment-system-api-gateway-service:
    image: ghcr.io/yuryshakhau1/payment-system-api-gateway-service:latest
    container_name: payment_system_api_gateway_service
    profiles:
      - docker
    ports:
      - "${API_GATE_WAY_SERVICE_PORT}:${API_GATE_WAY_SERVICE_PORT}"


volumes:
  user_service_postgres_data:
  auth_service_postgres_data:
  product_service_postgres_data:
  order_service_postgres_data:
  payment_system_redis_data:
  payment_system_kafka_data:
